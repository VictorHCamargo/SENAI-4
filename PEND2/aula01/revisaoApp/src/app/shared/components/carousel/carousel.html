<div
  class="relative w-full overflow-hidden rounded-2xl border border-slate-200 bg-slate-100 shadow-sm"
>
  <div class="h-80 w-full overflow-hidden">
    <div
      class="flex h-full transition-transform duration-500 ease-in-out"
      [style.transform]="'translateX(-' + currentIndex * 100 + '%)'"
    >
      @for (slide of slides; track slide.title) {
        <div class="flex min-w-full items-center justify-center p-6 {{ slide.color }}">
          <span class="text-2xl font-semibold sm:text-4xl {{ slide.text }}">{{ slide.title }}</span>
        </div>
      }
    </div>
  </div>

  <button
    type="button"
    (click)="prev()"
    class="absolute left-5 top-1/2 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full bg-white/80 text-lg text-slate-700 shadow-sm transition hover:bg-white"
    aria-label="Previous slide"
  >
    <span aria-hidden="true">‹</span>
  </button>

  <button
    type="button"
    (click)="next()"
    class="absolute right-5 top-1/2 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded-full bg-white/80 text-lg text-slate-700 shadow-sm transition hover:bg-white"
    aria-label="Next slide"
  >
    <span aria-hidden="true">›</span>
  </button>

  <div class="absolute inset-x-0 bottom-3 flex justify-center gap-3">
    @for (slide of slides; track slide.title; let i = $index) {
      <button
        type="button"
        (click)="goTo(i)"
        [attr.aria-label]="'Go to slide ' + (i + 1)"
        class="h-3 w-3 rounded-full transition-all"
        [class.bg-sky-600]="i === currentIndex"
        [class.bg-slate-300]="i !== currentIndex"
      ></button>
    }
  </div>
</div>
